# AfyaScribe on the Kenyan VPS.
#
#   app.afyascribe.co.ke  the web app — static files, served from disk
#   api.afyascribe.co.ke  the API — proxied to the backend container, which is
#                         bound to 127.0.0.1:3000 and unreachable otherwise
#
# Installed by deploy/setup-server.sh to /etc/nginx/sites-available/. The
# certificate is one Let's Encrypt certificate, named "afyascribe", covering
# both names.

# ── Port 80: certificate challenges, and a redirect for everything else ─────
server {
    listen 80;
    server_name app.afyascribe.co.ke api.afyascribe.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Anything addressed to the bare IP or an unknown name: no answer ─────────
# Scanners sweep IP ranges. They get nothing — not even a certificate that
# names the real hosts.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    # Here too, not only in the sites below: see tls.conf.
    include /etc/nginx/snippets/afyascribe-tls.conf;
    ssl_reject_handshake on;
    return 444;
}

# Ubuntu's nginx.conf already sets ssl_protocols at the http level, and
# repeating a directive at the same level stops nginx starting. So the TLS
# settings live in a snippet each HTTPS server includes, where they override.
server_tokens off;

# ── The API ─────────────────────────────────────────────────────────────────
server {
    # `listen … http2` rather than `http2 on;`: Ubuntu 24.04 ships nginx 1.24,
    # and the separate directive only arrived in 1.25.1.
    listen 443 ssl http2;
    server_name api.afyascribe.co.ke;

    ssl_certificate     /etc/letsencrypt/live/afyascribe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afyascribe/privkey.pem;
    include /etc/nginx/snippets/afyascribe-tls.conf;

    # Dictation audio is the largest request (about 34 MB, see the API's
    # main.ts); every other route is limited further by the API itself.
    client_max_body_size 35m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append. The API believes exactly one proxy hop
        # (TRUST_PROXY=1), so whatever a client writes in this header is
        # replaced by the address nginx actually saw. That is what the audit
        # trail records and what rate limiting counts.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Transcription can take a while on a long recording.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ── The web app ─────────────────────────────────────────────────────────────
server {
    # `listen … http2` rather than `http2 on;`: Ubuntu 24.04 ships nginx 1.24,
    # and the separate directive only arrived in 1.25.1.
    listen 443 ssl http2;
    server_name app.afyascribe.co.ke;

    ssl_certificate     /etc/letsencrypt/live/afyascribe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afyascribe/privkey.pem;
    include /etc/nginx/snippets/afyascribe-tls.conf;

    # A symlink to the current release; see deploy/web-release.sh in the
    # AfyaHIMS repository. Switching it is the deploy, and switching it back is
    # the rollback.
    root /var/www/afyascribe-web/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fingerprinted build output: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/afyascribe-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Paths beginning with a dot (/.env, /.git/config…) are never part of the
    # app. Without this the single-page fallback below answers them 200 with
    # index.html: nothing leaks, but to a scanner it reads as an exposed secrets
    # file. Certificate challenges use port 80, so /.well-known is unaffected.
    location ~ /\. {
        return 404;
    }

    # Everything else is the single-page app, including /register (the
    # self-registration QR) and /request-access. index.html must never be
    # cached, or a browser keeps running last week's release.
    location / {
        include /etc/nginx/snippets/afyascribe-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
