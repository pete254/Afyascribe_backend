# Included in every location of the web app's server block. nginx drops
# server-level add_header lines in any location that has its own, so the
# headers live here and each location includes them.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Dictation needs the microphone; nothing needs the camera or location.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

# Content security policy (vulnerability assessment V-06). Built from what the
# web app actually loads: its own bundle; styles the UI library injects at
# runtime (hence 'unsafe-inline' for style only — never for script); images
# from itself, QR codes (data:), generated files (blob:) and the API (logos and
# documents, which are kept on this server); API calls to the API alone; recorded dictation (blob:). Printing
# starts from the app's own code, so no inline script is needed anywhere.
# If a feature breaks, the browser console names the directive that blocked it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.afyascribe.co.ke; font-src 'self' data:; connect-src 'self' https://api.afyascribe.co.ke; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
