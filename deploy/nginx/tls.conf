# TLS for the AfyaScribe servers: TLS 1.3 only (Mozilla "modern"), as DHA's
# Encryption Implementation Specification template asks (Vulnerability
# Assessment V-16). TLS 1.3 fixes its own cipher suites — all AEAD, all with
# forward secrecy — so no ssl_ciphers list is needed.
#
# Clients need TLS 1.3: Android 10+, iOS 12.2+, and any current Chrome,
# Edge, Firefox or Safari. Older devices cannot connect at all; a facility
# reporting that is the first thing to check.
#
# Installed to /etc/nginx/snippets/afyascribe-tls.conf, and included by the
# catch-all server too: nginx agrees the protocol before it knows which site
# was asked for, so the default server's setting is the one that holds.
ssl_protocols TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:AfyaSSL:10m;
ssl_session_tickets off;
